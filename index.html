<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KitBench | Student Portal</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      color: #172554;
    }

    header {
      background: #172554;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin-bottom: 0; }

    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 26px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px #17255418;
    }

    .tabs { display: flex; gap: 10px; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
    }

    .tabs button {
      flex: 1;
      background: #e0e7ff;
      color: #172554;
    }

    .tabs button.active,
    .submit {
      background: #2563eb;
      color: white;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    label { font-size: 14px; font-weight: 600; }

    .submit { width: 100%; margin-top: 8px; }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .note {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      main { margin: 24px 14px; padding: 22px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>KitBench</h1>
    <p>Build Skills. Create Projects. Learn Together.</p>
  </header>

  <main>
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="signupTab" type="button">Sign Up</button>
    </div>

    <h2 id="formTitle">Student Login</h2>

    <form id="authForm">
      <div id="nameField" hidden>
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text"
          autocomplete="name" placeholder="Enter your full name">
      </div>

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email"
        autocomplete="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        autocomplete="current-password" placeholder="Enter your password"
        minlength="8" required>

      <div id="confirmPasswordField" hidden>
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword"
          type="password" autocomplete="new-password"
          placeholder="Re-enter your password" minlength="8">
      </div>

      <button class="submit" id="submitButton" type="submit">
        Login
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="note">
      Signup may require email verification. Use your own email address
      and keep your password private.
    </p>
  </main>

  <script>
    // Your KitBench backend
    const API = "https://kitbench-api.onrender.com";
    const REQUEST_TIMEOUT = 20000;

    let mode = "login";
    let busy = false;

    const form = document.getElementById("authForm");
    const message = document.getElementById("message");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("name");
    const passwordInput = document.getElementById("password");
    const confirmField = document.getElementById("confirmPasswordField");
    const confirmInput = document.getElementById("confirmPassword");
    const emailInput = document.getElementById("email");
    const submitButton = document.getElementById("submitButton");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    function setMessage(text) {
      message.textContent = text;
    }

    function setMode(nextMode) {
      if (busy) return;

      mode = nextMode;
      const signup = mode === "signup";

      loginTab.classList.toggle("active", !signup);
      signupTab.classList.toggle("active", signup);

      document.getElementById("formTitle").textContent =
        signup ? "Create Student Account" : "Student Login";

      submitButton.textContent = signup ? "Sign Up" : "Login";

      nameField.hidden = !signup;
      confirmField.hidden = !signup;
      nameInput.required = signup;
      confirmInput.required = signup;

      passwordInput.autocomplete =
        signup ? "new-password" : "current-password";

      setMessage("");
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    async function readResponse(response) {
      const text = await response.text();

      let data = {};
      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(
            "The server returned an unexpected response. Please try again."
          );
        }
      }

      if (!response.ok) {
        throw new Error(
          data.message || data.error ||
          `Request failed (HTTP ${response.status}).`
        );
      }

      return data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (busy) return;

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      const payload = { email, password };

      if (mode === "signup") {
        const name = nameInput.value.trim();

        if (!name) {
          setMessage("Please enter your full name.");
          nameInput.focus();
          return;
        }

        if (password.length < 8) {
          setMessage("Password must contain at least 8 characters.");
          passwordInput.focus();
          return;
        }

        if (password !== confirmInput.value) {
          setMessage("Passwords do not match.");
          confirmInput.focus();
          return;
        }

        payload.name = name;
        payload.confirmPassword = confirmInput.value;
      }

      busy = true;
      submitButton.disabled = true;
      loginTab.disabled = true;
      signupTab.disabled = true;
      setMessage("Connecting to KitBench server...");

      const controller = new AbortController();
      let timedOut = false;

      const timer = setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, REQUEST_TIMEOUT);

      try {
        const endpoint = mode === "signup"
          ? "/api/auth/register"
          : "/api/auth/login";

        const response = await fetch(API + endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });

        const data = await readResponse(response);

        if (mode === "login") {
          if (!data.token) {
            setMessage(
              data.message ||
              "The server did not return a login token. Check the backend."
            );
            return;
          }

          sessionStorage.setItem("kitbenchToken", data.token);
          setMessage("Login successful!");
        } else {
          setMessage(
            data.message ||
            "Signup request received. Follow the email verification instructions."
          );
        }
      } catch (error) {
        if (timedOut || error.name === "AbortError") {
          setMessage(
            "Server took too long to respond. Please try again. " +
            "If this continues, the backend needs checking."
          );
        } else if (error instanceof TypeError) {
          setMessage(
            "Could not connect to the server. Check your internet " +
            "connection and backend CORS settings."
          );
        } else {
          setMessage(error.message || "Something went wrong. Please try again.");
        }
      } finally {
        clearTimeout(timer);
        busy = false;
        submitButton.disabled = false;
        loginTab.disabled = false;
        signupTab.disabled = false;
      }
    });
  </script>
</body>
</html>
