```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KitBench | Student Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      color: #172554;
    }
    header {
      background: #172554;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 26px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px #17255418;
    }
    .tabs { display: flex; gap: 10px; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
    }
    .tabs button {
      flex: 1;
      background: #e0e7ff;
      color: #172554;
    }
    .tabs button.active, .submit {
      background: #2563eb;
      color: white;
    }
    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    label { font-size: 14px; font-weight: 600; }
    .submit { width: 100%; margin-top: 8px; }
    #message { margin-top: 16px; overflow-wrap: anywhere; }
    .note { font-size: 13px; color: #64748b; line-height: 1.5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>KitBench</h1>
    <p>Build Skills. Create Projects. Learn Together.</p>
  </header>

  <main>
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="signupTab" type="button">Sign Up</button>
    </div>

    <h2 id="formTitle">Student Login</h2>

    <form id="authForm">
      <div id="nameField" hidden>
        <label for="name">Full Name</label>
        <input id="name" type="text" autocomplete="name">
      </div>

      <label for="email">Email Address</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="Enter your email" required>

      <div id="codeField" hidden>
        <label for="code">Email Verification Code</label>
        <input id="code" type="text" inputmode="numeric"
               maxlength="6" pattern="[0-9]{6}">
        <p class="note">Check your email for the 6-digit code.</p>
      </div>

      <label for="password">Password</label>
      <input id="password" type="password" minlength="8"
             autocomplete="current-password" required>

      <div id="confirmField" hidden>
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" minlength="8">
      </div>

      <button class="submit" id="submitButton" type="submit">Login</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p class="note">Use your own email and keep your password private.</p>
  </main>

  <script>
    const API = "https://kitbench-api.onrender.com";

    // After successful login, open the separate dashboard page.
    const KITBENCH_HOME = "./dashboard.html";

    let mode = "login";
    let stage = "details";
    let busy = false;

    const form = document.getElementById("authForm");
    const message = document.getElementById("message");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const codeInput = document.getElementById("code");
    const submitButton = document.getElementById("submitButton");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    function showMessage(text) {
      message.textContent = text;
    }

    function updateForm() {
      const signup = mode === "signup";
      const verifying = signup && stage === "verify";

      loginTab.classList.toggle("active", !signup);
      signupTab.classList.toggle("active", signup);

      document.getElementById("formTitle").textContent =
        !signup ? "Student Login" :
        verifying ? "Verify Your Email" : "Create Student Account";

      document.getElementById("nameField").hidden = !signup || verifying;
      document.getElementById("confirmField").hidden = !signup || verifying;
      document.getElementById("codeField").hidden = !verifying;

      nameInput.required = signup && !verifying;
      confirmInput.required = signup && !verifying;
      codeInput.required = verifying;

      nameInput.disabled = !signup || verifying;
      confirmInput.disabled = !signup || verifying;
      codeInput.disabled = !verifying;

      emailInput.readOnly = verifying;
      passwordInput.autocomplete = signup ? "new-password" : "current-password";

      submitButton.textContent = !signup ? "Login" :
        verifying ? "Verify & Complete Signup" : "Send Verification Code";
    }

    function changeMode(nextMode) {
      if (busy) return;
      mode = nextMode;
      stage = "details";
      emailInput.readOnly = false;
      codeInput.value = "";
      showMessage("");
      updateForm();
    }

    loginTab.addEventListener("click", () => changeMode("login"));
    signupTab.addEventListener("click", () => changeMode("signup"));

    async function request(path, payload) {
      const response = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const text = await response.text();
      let data = {};

      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error("Unexpected server response. Please try again.");
        }
      }

      if (!response.ok) {
        throw new Error(data.error || data.message || "Request failed.");
      }

      return data;
    }

    function openDashboard(data) {
      if (!data.token) {
        throw new Error("The server did not return a login token.");
      }

      sessionStorage.setItem("kitbenchToken", data.token);
      sessionStorage.setItem("kitbenchUser", JSON.stringify(data.user || {}));

      // Open the dashboard instead of returning to the login page.
      window.location.href = KITBENCH_HOME;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (mode === "signup" && stage === "details") {
        if (nameInput.value.trim().length < 2) {
          showMessage("Enter your full name.");
          return;
        }
        if (password.length < 8 || password.length > 72) {
          showMessage("Password must be between 8 and 72 characters.");
          return;
        }
        if (password !== confirmInput.value) {
          showMessage("Passwords do not match.");
          return;
        }
      }

      if (mode === "signup" && stage === "verify" &&
          !/^\d{6}$/.test(codeInput.value.trim())) {
        showMessage("Enter the 6-digit code from your email.");
        return;
      }

      busy = true;
      submitButton.disabled = true;
      loginTab.disabled = true;
      signupTab.disabled = true;

      try {
        if (mode === "login") {
          showMessage("Logging in...");
          const data = await request("/api/auth/login", { email, password });
          openDashboard(data);
          return;
        }

        if (stage === "details") {
          showMessage("Sending verification code...");

          const data = await request("/api/auth/register", {
            name: nameInput.value.trim(),
            email,
            password,
            confirmPassword: confirmInput.value
          });

          stage = "verify";
          updateForm();
          showMessage(data.message || "Code sent. Enter the code from your email.");
          codeInput.focus();
        } else {
          showMessage("Verifying your email...");

          const data = await request("/api/auth/verify-email", {
            email,
            code: codeInput.value.trim()
          });

          openDashboard(data);
          return;
        }
      } catch (error) {
        showMessage(error.message || "Something went wrong. Please try again.");
      } finally {
        busy = false;
        submitButton.disabled = false;
        loginTab.disabled = false;
        signupTab.disabled = false;
      }
    });

    updateForm();
  </script>
</body>
</html>
